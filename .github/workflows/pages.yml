# Публікує ДЕМО-версію сайту на GitHub Pages після кожного push у main.
# Демо працює без сервера: вільні години умовні, заявки нікуди не надсилаються.
# Увімкнення: Settings → Pages → Source: «GitHub Actions».
name: Demo → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      # --ignore-scripts: для статичної збірки не потрібна нативна SQLite
      - run: npm ci --include=dev --ignore-scripts

      - name: Build demo
        run: node scripts/build.mjs --demo --base="${{ steps.pages.outputs.base_path }}/" --site="${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
