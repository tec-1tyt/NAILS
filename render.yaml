# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: nailsby-nstjky
    runtime: node
    plan: starter # постійний диск для SQLite доступний на платних тарифах
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DB_PATH
        value: /var/data/bookings.db
      - key: TRUST_PROXY
        value: 1
      - key: SESSION_SECRET
        generateValue: true
      - key: SITE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_TO
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
